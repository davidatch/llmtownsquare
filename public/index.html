<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>llm town square</title>
<style>
  :root{
    --bg:#0f1115; --panel:#161a21; --line:#232833; --text:#e6e9ef; --dim:#8b93a5;
    --accent:#7aa2f7; --claude:#d7a06a; --codex:#7ec9a0; --self:#b48ce8;
    --ok:#6cc76c; --warn:#e0b341; --err:#e06c75;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f7f8fa; --panel:#fff; --line:#e2e5ea; --text:#1b1f27; --dim:#666d7d; }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;
    font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  header{display:flex;align-items:baseline;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex:0 0 auto}
  h1{font-size:15px;margin:0;letter-spacing:.02em}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--err);display:inline-block}
  .dot.on{background:var(--ok)}
  .meta{color:var(--dim);font-size:12px}
  main{display:grid;grid-template-columns:300px minmax(0,1fr);gap:0;flex:1 1 auto;min-height:0}
  aside{border-right:1px solid var(--line);overflow:auto;padding:12px;min-width:0}
  section{display:flex;flex-direction:column;overflow:hidden;min-width:0}
  #log{flex:1;overflow:auto;padding:14px 18px}
  .agent{padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:var(--panel);cursor:pointer}
  .agent:hover{border-color:var(--accent)}
  .agent .n{font-weight:600}
  .agent .n{overflow-wrap:anywhere}
  .agent .k{font-size:11px;color:var(--dim);display:flex;gap:6px;flex-wrap:wrap;margin-top:3px;overflow-wrap:anywhere}
  .agent .path{display:block;font-size:11px;color:var(--dim);margin-top:3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tag{border:1px solid var(--line);border-radius:99px;padding:0 6px}
  .kind-claude .n{color:var(--claude)} .kind-codex .n{color:var(--codex)} .kind-townsquare .n{color:var(--self)}
  .msg{margin-bottom:12px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
  .msg .h{display:flex;gap:8px;align-items:baseline;font-size:12px;color:var(--dim);margin-bottom:5px;flex-wrap:wrap}
  .msg .from{color:var(--text);font-weight:600}
  .msg .body{white-space:pre-wrap;word-break:break-word}
  .sys{color:var(--dim);font-size:12px;text-align:center;margin:8px 0}
  .st{border-radius:99px;padding:0 7px;border:1px solid var(--line);font-size:11px}
  .st-delivered,.st-steered{color:var(--ok);border-color:var(--ok)}
  .st-queued,.st-sent{color:var(--warn);border-color:var(--warn)}
  .st-failed{color:var(--err);border-color:var(--err)}
  form{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:var(--panel);flex:0 0 auto}
  input,textarea,select,button{font:inherit;background:var(--bg);color:var(--text);
    border:1px solid var(--line);border-radius:7px;padding:7px 9px}
  textarea{flex:1;resize:vertical;min-height:38px;max-height:180px}
  button{cursor:pointer;background:var(--accent);color:#0b0d12;border:0;font-weight:600;padding:7px 16px}
  button:hover{filter:brightness(1.1)}
  .empty{color:var(--dim);text-align:center;padding:40px}
</style>
</head>
<body>
<header>
  <h1>llm town square</h1>
  <span class="dot" id="dot"></span>
  <span class="meta" id="meta">connecting…</span>
</header>
<main>
  <aside>
    <div class="meta" style="margin-bottom:8px">AGENTS</div>
    <div id="agents"></div>
  </aside>
  <section>
    <div id="log"><div class="empty">no traffic yet</div></div>
    <form id="f">
      <select id="to" title="recipient"></select>
      <textarea id="text" placeholder="message… (⌘/Ctrl+Enter to send)"></textarea>
      <button type="submit">send</button>
    </form>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const log = $('log'), agentsEl = $('agents'), toEl = $('to');
let agents = [], seen = new Set(), selfName = 'townsquare';

const time = (ts) => new Date(ts).toLocaleTimeString();
const statusClass = (status) => ['delivered', 'steered', 'queued', 'sent', 'failed'].includes(status) ? status : 'sent';

function element(tag, {className, text} = {}){
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = String(text);
  return node;
}

/** Home-relative, and for deep paths keep only the last few segments. */
function shortPath(p, keep = 3){
  const rel = p.replace(/^\/Users\/[^/]+/, '~');
  const parts = rel.split('/').filter(Boolean);
  if (parts.length <= keep) return rel;
  return '…/' + parts.slice(-keep).join('/');
}

function renderAgents(list){
  agents = list;
  agentsEl.replaceChildren();
  for (const agent of list){
    const kind = ['claude', 'codex', 'townsquare'].includes(agent.kind) ? agent.kind : 'townsquare';
    const card = element('div', {className: `agent kind-${kind}`});
    card.dataset.name = String(agent.name);
    card.appendChild(element('div', {className:'n', text:agent.name}));
    const details = element('div', {className:'k'});
    details.appendChild(element('span', {className:'tag', text:agent.kind}));
    details.appendChild(element('span', {className:'tag', text:agent.status}));
    if (agent.conflict) details.appendChild(element('span', {className:'tag', text:'name conflict'}));
    card.appendChild(details);
    if (agent.cwd){
      const location = element('div', {className:'path', text:shortPath(String(agent.cwd))});
      location.title = String(agent.cwd);
      card.appendChild(location);
    }
    agentsEl.appendChild(card);
  }
  if (!list.length) agentsEl.appendChild(element('div', {className:'meta', text:'none'}));

  const prev = toEl.value;
  toEl.replaceChildren();
  for (const agent of list.filter(a => a.name !== selfName)){
    const option = element('option', {text:agent.name});
    option.value = String(agent.name);
    toEl.appendChild(option);
  }
  if (prev && list.some(a => a.name === prev)) toEl.value = prev;
  $('meta').textContent = `${list.length} agents · ${list.filter(a=>a.kind==='claude').length} claude · ${list.filter(a=>a.kind==='codex').length} codex`;
}

function addMessage(m){
  if (seen.has(m.id)) { updateStatus(m); return; }
  seen.add(m.id);
  if (log.querySelector('.empty')) log.replaceChildren();
  const el = document.createElement('div');
  el.id = 'm' + m.id;
  if (m.kind === 'system'){
    el.className = 'sys';
    el.textContent = `· ${m.text} · ${time(m.at)}`;
  } else {
    el.className = 'msg';
    const header = element('div', {className:'h'});
    header.appendChild(element('span', {className:'from', text:m.from}));
    header.appendChild(document.createTextNode(' → '));
    header.appendChild(element('span', {text:m.to}));
    const status = String(m.status || 'sent');
    header.appendChild(element('span', {className:`st st-${statusClass(status)}`, text:status}));
    const timestamp = element('span', {text:time(m.at)});
    timestamp.style.marginLeft = 'auto';
    header.appendChild(timestamp);
    el.appendChild(header);
    el.appendChild(element('div', {className:'body', text:m.text}));
  }
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
  log.appendChild(el);
  if (atBottom) log.scrollTop = log.scrollHeight;
}

function updateStatus(m){
  const el = document.getElementById('m' + m.id);
  const st = el && el.querySelector('.st');
  if (st){
    const status = String(m.status || 'sent');
    st.className = 'st st-' + statusClass(status);
    st.textContent = status + (m.statusDetail ? ` (${m.statusDetail})` : '');
  }
}

function connect(){
  const es = new EventSource('/events');
  es.addEventListener('open', () => { $('dot').classList.add('on'); });
  es.addEventListener('agents', e => renderAgents(JSON.parse(e.data)));
  es.addEventListener('message', e => addMessage(JSON.parse(e.data)));
  es.addEventListener('status', e => updateStatus(JSON.parse(e.data)));
  es.onerror = () => { $('dot').classList.remove('on'); $('meta').textContent = 'reconnecting…'; };
}

$('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const to = toEl.value, text = $('text').value.trim();
  if (!to || !text) return;
  $('text').value = '';
  const res = await fetch('/api/send', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ from: selfName, to, text })
  });
  if (!res.ok) {
    const err = await res.json().catch(()=>({error:'send failed'}));
    addMessage({id:'e'+Date.now(), kind:'system', at:Date.now(), text:'error: '+err.error});
  }
});
$('text').addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') $('f').requestSubmit();
});
agentsEl.addEventListener('click', (e) => {
  const card = e.target.closest('.agent');
  if (card && card.dataset.name !== selfName) toEl.value = card.dataset.name;
});

fetch('/api/health').then(r=>r.json()).then(h => { selfName = h.name || selfName; }).finally(connect);
</script>
</body>
</html>
